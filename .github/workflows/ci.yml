name: Build and release

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      benchmark_linkers:
        description: Compare GNU ld and LLD using the same compiled objects
        type: boolean
        default: false
      native_linker:
        description: Native linker for timing comparisons
        type: choice
        options: [lld, default]
        default: lld
      native_autogen_depends:
        description: Forward target dependencies to Qt autogen
        type: choice
        options: ['ON', 'OFF']
        default: 'ON'
      native_shards:
        description: Native test runners (one shared compilation)
        type: choice
        options: ['2', '1']
        default: '2'

permissions:
  contents: read

concurrency:
  group: kobalt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CONTAINER_ENGINE: docker
  KOBALT_RELEASE_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}

jobs:
  superseded:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    concurrency:
      group: kobalt-select-${{ github.workflow }}-${{ github.sha }}
      cancel-in-progress: false
    outputs:
      proceed: ${{ steps.select.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: select
        uses: actions/github-script@v8
        with:
          script: await require('./platforms/ci/superseded.cjs').run({github, context, core})

  validation:
    needs: superseded
    if: needs.superseded.outputs.proceed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: version
        run: echo "version=$(bash platforms/ci/version.sh)" >> "$GITHUB_OUTPUT"
      - name: Check release helpers
        run: |
          node platforms/ci/superseded.test.cjs
          bash platforms/ci/test.sh

  native-build:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache compiled dependencies
        uses: actions/cache@v5
        with:
          path: build/dependency-cache
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-linux-${{ hashFiles('platforms/sdk-image.sh', 'dependencies/**', 'platforms/**/*.cmake', 'platforms/**/CMakeLists.txt', 'platforms/**/CMakePresets.json') }}
          restore-keys: deps-v1-${{ runner.os }}-${{ runner.arch }}-linux-
      - name: Cache native compilation
        uses: actions/cache@v5
        with:
          path: build/ccache
          key: objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platforms/sdk-image.sh') }}-${{ github.sha }}
          restore-keys: objects-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platforms/sdk-image.sh') }}-
      - name: Build native tests
        env:
          KOBALT_COMPILER_CACHE: '1'
          KOBALT_BENCHMARK_LINKERS: ${{ inputs.benchmark_linkers && '1' || '0' }}
          KOBALT_NATIVE_LINKER: ${{ inputs.native_linker || 'lld' }}
          KOBALT_NATIVE_AUTOGEN_DEPENDS: ${{ inputs.native_autogen_depends || 'ON' }}
        run: bash platforms/ci/native-tests.sh build
      - name: Pack test executables and CTest configuration
        run: |
          tar --exclude=CMakeFiles --exclude=.ninja_deps --exclude=.ninja_log \
            -I 'zstd -T0 -3' -cf build/native-tests.tar.zst -C build desktop-linux
      - uses: actions/upload-artifact@v7
        with:
          name: native-test-runtime
          path: build/native-tests.tar.zst
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@v7
        with:
          name: native-build-timings
          path: build/desktop-linux/.ninja_log
          include-hidden-files: true
          retention-days: 7

  native-tests:
    needs: native-build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.native_shards == '1' && '[1]' || '[1,2]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: native-test-runtime
          path: build
      - name: Restore test executables and CTest configuration
        run: tar -I zstd -xf build/native-tests.tar.zst -C build
      - name: Run native tests (all variants on tags)
        env:
          KOBALT_TEST_SHARD: ${{ matrix.shard }}
          KOBALT_TEST_SHARDS: ${{ inputs.native_shards || '2' }}
        run: bash platforms/ci/native-tests.sh test

  build-kobo:
    needs: [validation, native-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        target: [qt5, qt6]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache compiled dependencies
        uses: actions/cache@v5
        with:
          path: build/dependency-cache
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-${{ hashFiles('platforms/sdk-image.sh', 'dependencies/**', 'platforms/**/*.cmake', 'platforms/**/CMakeLists.txt', 'platforms/**/CMakePresets.json') }}
          restore-keys: deps-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.target }}-
      - name: Run the adapter tests, then build and verify package
        env:
          TARGET: ${{ matrix.target }}
          KOBALT_RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        run: bash platforms/ci/build.sh "$TARGET"
      - uses: actions/upload-artifact@v7
        with:
          name: kobalt-${{ matrix.target }}
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

  build-android:
    needs: [validation, native-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache compiled dependencies
        uses: actions/cache@v5
        with:
          path: build/dependency-cache
          key: deps-v1-${{ runner.os }}-${{ runner.arch }}-android-${{ hashFiles('platforms/sdk-image.sh', 'dependencies/**', 'platforms/**/*.cmake', 'platforms/**/CMakeLists.txt', 'platforms/**/CMakePresets.json') }}
          restore-keys: deps-v1-${{ runner.os }}-${{ runner.arch }}-android-
      - name: Cache Gradle packages
        uses: actions/cache@v5
        with:
          path: |
            build/gradle/caches
            build/gradle/wrapper
          key: gradle-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('platforms/sdk-image.sh', 'platforms/android/CMakeLists.txt', 'platforms/android/**/*.gradle*', 'platforms/android/**/gradle.properties*') }}
          restore-keys: gradle-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Missing ANDROID_KEYSTORE_BASE64'; exit 1; }
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kobalt-release.keystore"
      - name: Build, sign and verify release APK
        env:
          KOBALT_RELEASE_VERSION: ${{ needs.validation.outputs.version }}
          KOBALT_ANDROID_VERSION_CODE: ${{ github.run_number }}
          KOBALT_ANDROID_KEYSTORE: ${{ runner.temp }}/kobalt-release.keystore
          KOBALT_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KOBALT_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KOBALT_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KOBALT_ANDROID_CERT_SHA256: ${{ vars.ANDROID_CERT_SHA256 }}
        run: bash platforms/ci/build.sh android
      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/kobalt-release.keystore"
      - uses: actions/upload-artifact@v7
        with:
          name: kobalt-android
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

  archive-source:
    needs: validation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Cache verified source downloads
        uses: actions/cache@v5
        with:
          path: build/release-source-cache
          key: sources-v1-${{ hashFiles('dependencies/manifest.json', 'dependencies/release-sources.json') }}
          restore-keys: sources-v1-
      - name: Assemble verified source bundle
        env:
          KOBALT_RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        run: bash platforms/ci/source-archive.sh
      - name: Verify extracted source configuration offline
        run: |
          docker pull "$(sh platforms/sdk-image.sh qt6)"
          bash platforms/ci/check-source-archive.sh
      - uses: actions/upload-artifact@v7
        with:
          name: kobalt-source
          path: build/release/*
          if-no-files-found: error
          compression-level: 0

  release-draft:
    needs: [validation, build-kobo, build-android, archive-source]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          pattern: kobalt-*
          merge-multiple: true
          path: build/release
      - name: Create or update draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KOBALT_RELEASE_VERSION: ${{ needs.validation.outputs.version }}
        run: bash platforms/ci/draft-release.sh
